<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GM Club – Kvízest</title>
  <link rel="icon" type="image/png" href="./logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="./config.js"></script>
  <script src="./questions.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #F8F5EC;
      --terracotta: #DB562B;
      --terracotta-dark: #B9421C;
      --tangerine: #FA8841;
      --ink: #1C1917;
      --muted: #6B6258;
      --line: #E8DEC9;
    }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background-color: var(--cream);
      color: var(--ink);
    }
    .font-brand {
      font-family: 'Fraunces', Georgia, serif;
    }
    .card-surface {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      box-shadow: 0 18px 40px -24px rgba(120, 53, 15, 0.18), 0 4px 12px -4px rgba(28, 25, 23, 0.05);
      backdrop-filter: blur(8px);
    }
    .fade-in { animation: fadeIn 0.32s ease-out both; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pulse-ring { animation: pulseRing 1.1s ease-in-out infinite; }
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }
    #qrcode img, #qrcode canvas { margin: 0 auto; border-radius: 14px; }
    .emoji-float { animation: emojiFloat 2.8s ease-in-out infinite; }
    @keyframes emojiFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.04); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#DB562B] selection:text-white overflow-x-hidden relative">

  <!-- Minimalista GM Club háttér motívumok (SVG organikus formák) -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none select-none" aria-hidden="true">
    <svg class="absolute top-10 -left-6 w-40 md:w-52 opacity-90" viewBox="0 0 220 260" fill="none">
      <path d="M98 18C136 22 152 68 178 104C204 140 218 184 192 218C166 252 106 254 68 228C30 202 8 158 18 110C28 62 60 14 98 18Z" fill="#DB562B"/>
    </svg>
    <svg class="absolute -bottom-24 -left-24 w-72 md:w-[26rem] opacity-90" viewBox="0 0 420 460" fill="none">
      <path d="M56 32C128 6 196 58 226 128C256 198 338 224 374 294C410 364 366 446 286 456C206 466 84 446 34 378C-16 310 -16 58 56 32Z" fill="#FA8841"/>
    </svg>
    <svg class="absolute -top-20 -right-24 w-72 md:w-[27rem] opacity-90" viewBox="0 0 440 480" fill="none">
      <path d="M134 12C214 -14 338 14 398 92C458 170 434 328 362 404C290 480 172 478 118 418C64 358 54 276 92 216C130 156 54 38 134 12Z" fill="#FA8841"/>
    </svg>
    <svg class="absolute bottom-14 right-6 w-36 md:w-48 opacity-90" viewBox="0 0 220 220" fill="none">
      <path d="M120 14C166 12 206 54 196 102C186 150 162 208 110 206C58 204 12 162 16 112C20 62 74 16 120 14Z" fill="#DB562B"/>
    </svg>
    <svg class="absolute top-32 right-64 w-28 opacity-20 hidden lg:block" viewBox="0 0 120 120" fill="none">
      <circle cx="15" cy="15" r="4" fill="#DB562B"/><circle cx="45" cy="15" r="4" fill="#DB562B"/><circle cx="75" cy="15" r="4" fill="#DB562B"/>
      <circle cx="15" cy="45" r="4" fill="#DB562B"/><circle cx="45" cy="45" r="4" fill="#DB562B"/><circle cx="75" cy="45" r="4" fill="#DB562B"/>
      <circle cx="15" cy="75" r="4" fill="#DB562B"/><circle cx="45" cy="75" r="4" fill="#DB562B"/><circle cx="75" cy="75" r="4" fill="#DB562B"/>
    </svg>
  </div>

  <!-- Letisztult, stílusos GM Club fejléc -->
  <header class="w-full px-6 md:px-10 py-3.5 flex items-center justify-between border-b border-[#E8DEC9]/90 bg-[#F8F5EC]/85 backdrop-blur-md sticky top-0 z-20">
    <div class="flex items-center gap-3.5">
      <div class="relative w-12 h-12 rounded-full shrink-0 shadow-md shadow-[#DB562B]/20 ring-2 ring-white overflow-hidden bg-[#DB562B] flex items-center justify-center">
        <img src="./logo.png" alt="GM Club logó" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
        <span class="hidden w-full h-full items-center justify-center font-black text-sm text-white tracking-tight">GM</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="font-brand text-2xl md:text-[26px] font-black tracking-tight text-[#DB562B] leading-none">
          GM CLUB
        </span>
        <span class="hidden sm:inline-block h-5 w-px bg-[#D9CCB5]"></span>
        <span id="headerTitle" class="hidden sm:inline-block text-sm font-bold uppercase tracking-[0.16em] text-[#6B6258]">
          Kvízest
        </span>
        <span id="demoPill" class="hidden px-2.5 py-0.5 rounded-full bg-[#FA8841]/20 text-[#B9421C] text-[11px] font-bold uppercase tracking-wider">

    </div>

    <div class="flex items-center gap-2.5">
      <span id="progressBadge" class="hidden px-4 py-1.5 rounded-full bg-white border border-[#E8DEC9] text-sm font-bold text-[#1C1917] shadow-sm">
        1 / 14 kérdés
      </span>
      <button onclick="toggleFullscreen()" title="Teljes képernyő (F)" class="px-3.5 py-2 rounded-xl bg-white/90 hover:bg-white border border-[#E8DEC9] text-xs font-bold text-[#44403C] transition shadow-sm flex items-center gap-1.5">
        <span>⛶</span>
        <span class="hidden md:inline">Teljes képernyő</span>
      </button>
      <button onclick="confirmReset()" class="px-3.5 py-2 rounded-xl bg-[#DB562B]/10 hover:bg-[#DB562B]/20 border border-[#DB562B]/25 text-xs font-bold text-[#B9421C] transition">
        Új játék
      </button>
    </div>
  </header>

  <!-- Fő tartalom -->
  <main id="stage" class="flex-1 w-full max-w-6xl mx-auto px-6 py-6 flex flex-col justify-center relative z-10">
    <!-- JS tölti ki -->
  </main>

  <!-- Nagyítható kép overlay (kattintásra) -->
  <div id="imageModal" onclick="closeImageModal()" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm p-6 flex items-center justify-center cursor-zoom-out">
    <img id="imageModalImg" src="" alt="Nagyított kép" class="max-w-full max-h-[92vh] rounded-2xl shadow-2xl object-contain" />
  </div>

  <!-- Moderátori vezérlősáv alul -->
  <footer id="controlBar" class="w-full px-6 md:px-10 py-3.5 border-t border-[#E8DEC9] bg-[#F8F5EC]/90 backdrop-blur-md flex flex-wrap items-center justify-between gap-4 relative z-20">
    <div id="statusSummary" class="text-sm text-[#57534E] font-semibold">
      Készülj fel az indulásra!
    </div>
    <div id="actionButtons" class="flex items-center gap-3">
      <!-- JS tölti ki -->
    </div>
  </footer>

  <script>
    const QUESTIONS = window.QUIZ_QUESTIONS || [];
    const QUIZ_TITLE = window.QUIZ_TITLE || "Kvízest";
    document.getElementById("headerTitle").textContent = QUIZ_TITLE;

    const OPTION_LABELS = ["A", "B", "C", "D"];
    const OPTION_STYLES = [
      { bg: "bg-[#DB562B]", ring: "border-[#DB562B]/25" },
      { bg: "bg-[#0F766E]", ring: "border-[#0F766E]/25" },
      { bg: "bg-[#FA8841]", ring: "border-[#FA8841]/30" },
      { bg: "bg-[#3730A3]", ring: "border-[#3730A3]/25" }
    ];

    let db = null;
    let demoMode = false;
    let timerInterval = null;
    let timerRafId = null;
    let timeLeft = 0;
    let timerEndAt = 0;
    let timerDurationMs = 0;
    let lastScreenKey = "";
    let renderedQuestionKey = "";

    let state = {
      status: "setup", // setup | lobby | section_intro | question | reveal | leaderboard | finished
      currentIndex: -1,
      acceptingAnswers: false,
      teams: {},
      answers: {},
      scored: {},
      revealedAnswer: null,
      sectionIntro: null
    };

    // Szakaszok metaadatai (a kérdéstípus-váltások előtt megjelenő nyitóoldalhoz)
    function isSectionStart(index) {
      if (index < 0 || index >= QUESTIONS.length) return false;
      if (index === 0) return true;
      return QUESTIONS[index].type !== QUESTIONS[index - 1].type;
    }

    function getSectionMeta(index) {
      const q = QUESTIONS[index];
      if (!q) return null;

      let sectionNumber = 1;
      for (let i = 1; i <= index; i++) {
        if (QUESTIONS[i].type !== QUESTIONS[i - 1].type) sectionNumber++;
      }

      let count = 0;
      for (let i = index; i < QUESTIONS.length; i++) {
        if (QUESTIONS[i].type === q.type) count++;
        else break;
      }

      if (q.type === "abcd") {
        return {
          sectionNumber,
          count,
          type: "abcd",
          title: "Feleletválasztós kérdések",
          emoji: "🤔",
          subtitle: "Négy lehetőség, egy helyes válasz — minden jó találat +100 pontot ér.",
          badgeClass: "bg-[#DB562B]/12 text-[#B9421C] border-[#DB562B]/25",
          glowClass: "from-[#FFF1E6] via-[#FFE4D1] to-[#FFF7F0] border-[#FA8841]/45"
        };
      }
      if (q.type === "text") {
        return {
          sectionNumber,
          count,
          type: "text",
          title: "Képfelismerés",
          emoji: "🧐",
          subtitle: "Nézzétek meg jól a kivetített képet, és írjátok be a zenekar nevét telefonon! (60 mp / kép)",
          badgeClass: "bg-[#0F766E]/12 text-[#0F766E] border-[#0F766E]/25",
          glowClass: "from-[#ECFAF7] via-[#D7F4EE] to-[#F4FCFA] border-[#0F766E]/30"
        };
      }
      return {
        sectionNumber,
        count,
        type: "number",
        title: "Tippelős kérdések",
        emoji: "💯",
        subtitle: "Telitalálat +150 pt • Legközelebbi tipp +100 pt • 2. legközelebbi +50 pt",
        badgeClass: "bg-[#FA8841]/20 text-[#9A3412] border-[#FA8841]/40",
        glowClass: "from-[#FFF5EB] via-[#FFE6CC] to-[#FFF9F2] border-[#DB562B]/35"
      };
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatNumber(n) {
      if (typeof n !== "number" || Number.isNaN(n)) return String(n);
      return n.toLocaleString("hu-HU", { maximumFractionDigits: 4 });
    }

    // Kis-/nagybetű, ékezet és írásjel független szövegnormalizálás
    function normalizeTextAnswer(str) {
      return String(str ?? "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/&/g, " and ")
        .replace(/['’`´]/g, "")
        .replace(/[^a-z0-9]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function isTextAnswerCorrect(userInput, question) {
      const normUser = normalizeTextAnswer(userInput);
      if (!normUser) return false;
      const acceptedList = Array.isArray(question.acceptedAnswers) && question.acceptedAnswers.length
        ? question.acceptedAnswers
        : [question.correct];
      return acceptedList.some((acc) => normalizeTextAnswer(acc) === normUser);
    }

    // Képek háttérbeli előtöltése, hogy kivetítéskor azonnal megjelenjenek
    function preloadQuestionImages() {
      QUESTIONS.forEach((q) => {
        if (q.image) {
          const img = new Image();
          img.src = q.image;
        }
      });
    }

    function openImageModal(src) {
      const modal = document.getElementById("imageModal");
      const img = document.getElementById("imageModalImg");
      if (!modal || !img) return;
      img.src = src;
      modal.classList.remove("hidden");
    }

    function closeImageModal() {
      const modal = document.getElementById("imageModal");
      if (modal) modal.classList.add("hidden");
    }

    function getPlayerUrl() {
      if (window.location.protocol.startsWith("http")) {
        return new URL("./", window.location.href).href;
      }
      return new URL("./index.html", window.location.href).href;
    }

    function init() {
      preloadQuestionImages();

      if (!window.isFirebaseConfigured()) {
        state.status = "setup";
        render();
        return;
      }

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(window.FIREBASE_CONFIG);
        }
        db = firebase.database();

        db.ref("quiz/teams").on("value", (snap) => {
          state.teams = snap.val() || {};
          render();
        });

        db.ref("quiz/answers").on("value", (snap) => {
          state.answers = snap.val() || {};
          render();
        });

        db.ref("quiz").once("value", (snap) => {
          const val = snap.val();
          if (val && val.status && val.status !== "setup") {
            state.status = val.status;
            state.currentIndex = typeof val.currentIndex === "number" ? val.currentIndex : -1;
            state.acceptingAnswers = Boolean(val.acceptingAnswers);
            state.scored = val.scored || {};
            state.revealedAnswer = val.revealedAnswer || null;
            state.sectionIntro = val.sectionIntro || (state.status === "section_intro" ? getSectionMeta(state.currentIndex) : null);
            state.teams = val.teams || {};
            state.answers = val.answers || {};
            if (state.status === "question" && QUESTIONS[state.currentIndex]) {
              const totalSec = QUESTIONS[state.currentIndex].time || 30;
              timerDurationMs = totalSec * 1000;
              timeLeft = state.acceptingAnswers ? totalSec : 0;
              if (state.acceptingAnswers) {
                render();
                startTimer();
                return;
              }
            }
            render();
          } else {
            resetGame(false);
          }
        });
      } catch (err) {
        console.error(err);
        alert("Firebase hiba: " + err.message);
        state.status = "setup";
        render();
      }
    }

    function startDemoMode() {
      demoMode = true;
      db = null;
      document.getElementById("demoPill").classList.remove("hidden");
      state = {
        status: "lobby",
        currentIndex: -1,
        acceptingAnswers: false,
        teams: {
          t1: { name: "Kék Villámok", score: 0, joinedAt: 1 },
          t2: { name: "Kávéfüggők", score: 0, joinedAt: 2 },
          t3: { name: "Bajnokok Ligája", score: 0, joinedAt: 3 },
          t4: { name: "Tippelők", score: 0, joinedAt: 4 },
          t5: { name: "Kettős Ügynökök", score: 0, joinedAt: 5 }
        },
        answers: {},
        scored: {},
        revealedAnswer: null
      };
      render();
    }

    function simulateDemoAnswers(qIndex) {
      if (!demoMode) return;
      const q = QUESTIONS[qIndex];
      const teamIds = Object.keys(state.teams);
      if (!state.answers[qIndex]) state.answers[qIndex] = {};

      teamIds.forEach((tid, idx) => {
        setTimeout(() => {
          if (state.status !== "question" || state.currentIndex !== qIndex || !state.acceptingAnswers) return;
          let val;
          if (q.type === "abcd") {
            val = Math.random() < 0.55 ? q.correct : Math.floor(Math.random() * 4);
          } else if (q.type === "number") {
            const spread = Math.max(10, Math.round(Math.abs(q.correct) * 0.12));
            const offset = Math.round((Math.random() - 0.5) * 2 * spread);
            val = idx === 1 && Math.random() < 0.35 ? q.correct : q.correct + offset;
          } else if (q.type === "text") {
            const variants = (q.acceptedAnswers && q.acceptedAnswers.length) ? q.acceptedAnswers : [q.correct];
            if (idx === 0) val = variants[0].toLowerCase();
            else if (idx === 1 && variants.length > 1) val = variants[1];
            else if (idx === 2) val = variants[0].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
            else if (idx === 3) val = "Valami más együttes";
            else val = variants[0].slice(0, -1); // szándékos apró elírás teszteléshez
          }
          state.answers[qIndex][tid] = { value: val, submittedAt: Date.now() };
          render();
        }, 800 + idx * 700);
      });
    }

    function pushToDb(patch) {
      if (!demoMode && db) {
        return db.ref("quiz").update(patch);
      }
      return Promise.resolve();
    }

    function confirmReset() {
      if (confirm("Biztosan új játékot indítasz? Minden csapat és pontszám törlődik!")) {
        resetGame(true);
      }
    }

    function resetGame(clearTeams = true) {
      stopTimer();
      closeImageModal();
      state.status = "lobby";
      state.currentIndex = -1;
      state.acceptingAnswers = false;
      state.revealedAnswer = null;
      state.sectionIntro = null;
      state.scored = {};
      state.answers = {};
      renderedQuestionKey = "";
      if (clearTeams && !demoMode) state.teams = {};
      if (demoMode && clearTeams) {
        Object.values(state.teams).forEach(t => (t.score = 0));
      }

      if (!demoMode && db) {
        db.ref("quiz").set({
          title: QUIZ_TITLE,
          status: "lobby",
          currentIndex: -1,
          acceptingAnswers: false,
          question: null,
          revealedAnswer: null,
          sectionIntro: null,
          teams: clearTeams ? null : (state.teams || null),
          answers: null,
          scored: null
        });
      }
      render();
    }

    function advanceToQuestion(index) {
      if (index >= QUESTIONS.length) {
        showFinished();
        return;
      }
      if (isSectionStart(index)) {
        showSectionIntro(index);
      } else {
        startQuestion(index);
      }
    }

    function showSectionIntro(index) {
      stopTimer();
      closeImageModal();
      renderedQuestionKey = "";
      const meta = getSectionMeta(index);
      state.status = "section_intro";
      state.currentIndex = index;
      state.acceptingAnswers = false;
      state.revealedAnswer = null;
      state.sectionIntro = meta;

      pushToDb({
        status: "section_intro",
        currentIndex: index,
        acceptingAnswers: false,
        question: null,
        revealedAnswer: null,
        sectionIntro: {
          sectionNumber: meta.sectionNumber,
          count: meta.count,
          type: meta.type,
          title: meta.title,
          emoji: meta.emoji,
          subtitle: meta.subtitle
        }
      });

      render();
    }

    function startQuestion(index) {
      if (index >= QUESTIONS.length) {
        showFinished();
        return;
      }
      stopTimer();
      closeImageModal();
      renderedQuestionKey = "";
      const q = QUESTIONS[index];
      const totalSec = q.time || 30;
      state.status = "question";
      state.currentIndex = index;
      state.acceptingAnswers = true;
      state.revealedAnswer = null;
      state.sectionIntro = null;
      timeLeft = totalSec;
      timerDurationMs = totalSec * 1000;
      timerEndAt = Date.now() + timerDurationMs;

      // A telefonokra NEM küldjük át sem a helyes választ, sem a kép fájlnevét (csalás ellen)
      const publicQuestion = {
        index,
        total: QUESTIONS.length,
        type: q.type,
        category: q.category || "Kérdés",
        text: q.text,
        options: q.type === "abcd" ? q.options : null,
        unit: q.unit || "",
        placeholder: q.placeholder || "",
        hasImage: Boolean(q.image)
      };

      pushToDb({
        status: "question",
        currentIndex: index,
        acceptingAnswers: true,
        question: publicQuestion,
        revealedAnswer: null,
        sectionIntro: null
      });

      render();
      startTimer();
      if (demoMode) simulateDemoAnswers(index);
    }

    function getRemainingRatio() {
      if (!state.acceptingAnswers || state.status !== "question" || !timerEndAt || !timerDurationMs) {
        return 0;
      }
      return Math.max(0, Math.min(1, (timerEndAt - Date.now()) / timerDurationMs));
    }

    function tickTimer() {
      if (!state.acceptingAnswers || state.status !== "question" || !timerEndAt) {
        stopTimer();
        timeLeft = 0;
        updateTimerUI(0);
        return;
      }
      const remainingMs = Math.max(0, timerEndAt - Date.now());
      const ratio = timerDurationMs > 0 ? Math.max(0, Math.min(1, remainingMs / timerDurationMs)) : 0;
      const nextLeft = Math.max(0, Math.ceil(remainingMs / 1000));

      if (nextLeft !== timeLeft) {
        timeLeft = nextLeft;
      }
      updateTimerUI(ratio);

      if (remainingMs <= 0) {
        stopTimer();
        lockAnswers();
        return;
      }
      timerRafId = requestAnimationFrame(tickTimer);
    }

    function startTimer() {
      const preservedEndAt = timerEndAt;
      stopTimer();
      if (!state.acceptingAnswers || state.status !== "question" || timeLeft <= 0) {
        timeLeft = 0;
        updateTimerUI(0);
        return;
      }
      if (!timerDurationMs) {
        timerDurationMs = (QUESTIONS[state.currentIndex]?.time || 30) * 1000;
      }
      timerEndAt = preservedEndAt > Date.now() ? preservedEndAt : (Date.now() + timeLeft * 1000);
      timerRafId = requestAnimationFrame(tickTimer);

      // Tartalék ellenőrzés arra az esetre, ha háttérbe kerülne a böngészőfül
      timerInterval = setInterval(() => {
        if (!state.acceptingAnswers || state.status !== "question" || !timerEndAt) {
          stopTimer();
          return;
        }
        if (Date.now() >= timerEndAt) {
          stopTimer();
          lockAnswers();
        }
      }, 250);
    }

    function stopTimer() {
      if (timerRafId) {
        cancelAnimationFrame(timerRafId);
        timerRafId = null;
      }
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      timerEndAt = 0;
    }

    function lockAnswers() {
      stopTimer();
      timeLeft = 0;
      renderedQuestionKey = "";
      if (!state.acceptingAnswers) {
        updateTimerUI(0);
        return;
      }
      state.acceptingAnswers = false;
      pushToDb({ acceptingAnswers: false });
      render();
    }

    function revealAnswer() {
      stopTimer();
      closeImageModal();
      const idx = state.currentIndex;
      const q = QUESTIONS[idx];
      const qAnswers = (state.answers && state.answers[idx]) ? state.answers[idx] : {};

      let awards = {};
      let numberRanking = [];
      let textResults = [];

      if (q.type === "abcd") {
        const pts = q.points || 100;
        Object.entries(qAnswers).forEach(([tid, ans]) => {
          if (!state.teams[tid]) return;
          if (Number(ans.value) === Number(q.correct)) {
            awards[tid] = { delta: pts, label: `+${pts} pt` };
          } else {
            awards[tid] = { delta: 0, label: "0 pt" };
          }
        });
      } else if (q.type === "number") {
        const entries = Object.entries(qAnswers)
          .filter(([tid, ans]) => state.teams[tid] && !Number.isNaN(Number(ans.value)))
          .map(([tid, ans]) => {
            const val = Number(ans.value);
            return {
              teamId: tid,
              teamName: state.teams[tid].name,
              value: val,
              diff: Math.abs(val - q.correct)
            };
          })
          .sort((a, b) => a.diff - b.diff);

        const uniqueDiffs = [...new Set(entries.map(e => e.diff))];
        const bestDiff = uniqueDiffs[0];
        const secondDiff = entries.length >= 3 ? uniqueDiffs[1] : undefined;

        entries.forEach((e) => {
          let delta = 0;
          let badge = "";
          if (e.diff === 0) {
            delta = 150;
            badge = "Telitalálat! (+150)";
          } else if (e.diff === bestDiff) {
            delta = 100;
            badge = "Legközelebbi! (+100)";
          } else if (secondDiff !== undefined && e.diff === secondDiff) {
            delta = 50;
            badge = "2. legközelebbi (+50)";
          }
          awards[e.teamId] = { delta, label: badge || "0 pt" };
          numberRanking.push({ ...e, delta, badge });
        });
      } else if (q.type === "text") {
        const pts = q.points || 100;
        const sortedTeamList = getSortedTeams();
        sortedTeamList.forEach((t) => {
          const ans = qAnswers[t.id];
          if (!ans || !String(ans.value ?? "").trim()) {
            awards[t.id] = { delta: 0, label: "0 pt" };
            textResults.push({
              teamId: t.id,
              teamName: t.name,
              rawAnswer: "",
              isCorrect: false,
              delta: 0,
              manual: false
            });
            return;
          }
          const raw = String(ans.value).trim();
          const ok = isTextAnswerCorrect(raw, q);
          const delta = ok ? pts : 0;
          awards[t.id] = { delta, label: ok ? `+${pts} pt` : "0 pt" };
          textResults.push({
            teamId: t.id,
            teamName: t.name,
            rawAnswer: raw,
            isCorrect: ok,
            delta,
            manual: false
          });
        });
        // A helyes válaszok legyenek elöl
        textResults.sort((a, b) => Number(b.isCorrect) - Number(a.isCorrect));
      }

      const revealed = {
        type: q.type,
        correct: q.correct,
        display: q.type === "abcd"
          ? `${OPTION_LABELS[q.correct]}) ${q.options[q.correct]}`
          : q.type === "number"
            ? `${formatNumber(q.correct)}${q.unit ? " " + q.unit : ""}`
            : String(q.correct),
        explanation: q.explanation || "",
        awards,
        numberRanking,
        textResults
      };

      const updates = {
        status: "reveal",
        acceptingAnswers: false,
        revealedAnswer: revealed
      };

      if (!state.scored[idx]) {
        state.scored[idx] = true;
        updates[`scored/${idx}`] = true;
        Object.entries(awards).forEach(([tid, info]) => {
          if (state.teams[tid] && info.delta > 0) {
            const newScore = (state.teams[tid].score || 0) + info.delta;
            state.teams[tid].score = newScore;
            updates[`teams/${tid}/score`] = newScore;
          }
        });
      }

      state.status = "reveal";
      state.acceptingAnswers = false;
      state.revealedAnswer = revealed;

      pushToDb(updates);
      render();
    }

    // Moderátori kézi elfogadás / visszavonás szöveges válaszoknál (elírás esetére)
    function toggleTextOverride(teamId) {
      const q = QUESTIONS[state.currentIndex];
      if (!q || q.type !== "text" || !state.revealedAnswer || !state.teams[teamId]) return;
      const pts = q.points || 100;
      const rev = state.revealedAnswer;
      const item = (rev.textResults || []).find((r) => r.teamId === teamId);
      if (!item) return;

      let scoreDiff = 0;
      if (item.isCorrect) {
        scoreDiff = -item.delta;
        item.isCorrect = false;
        item.delta = 0;
        item.manual = true;
        rev.awards[teamId] = { delta: 0, label: "0 pt" };
      } else {
        scoreDiff = pts;
        item.isCorrect = true;
        item.delta = pts;
        item.manual = true;
        rev.awards[teamId] = { delta: pts, label: `+${pts} pt (elfogadva)` };
      }

      const nextScore = Math.max(0, (state.teams[teamId].score || 0) + scoreDiff);
      state.teams[teamId].score = nextScore;

      const updates = {
        revealedAnswer: rev,
        [`teams/${teamId}/score`]: nextScore
      };
      pushToDb(updates);
      render();
    }

    function showLeaderboard() {
      stopTimer();
      closeImageModal();
      state.status = "leaderboard";
      pushToDb({ status: "leaderboard" });
      render();
    }

    function showFinished() {
      stopTimer();
      closeImageModal();
      state.status = "finished";
      pushToDb({ status: "finished" });
      render();
    }

    function adjustScore(teamId, delta) {
      if (!state.teams[teamId]) return;
      const nextScore = Math.max(0, (state.teams[teamId].score || 0) + delta);
      state.teams[teamId].score = nextScore;
      if (!demoMode && db) {
        db.ref(`quiz/teams/${teamId}/score`).set(nextScore);
      }
      render();
    }

    function removeTeam(teamId) {
      if (!state.teams[teamId]) return;
      if (!confirm(`Eltávolítod a(z) "${state.teams[teamId].name}" csapatot?`)) return;
      delete state.teams[teamId];
      if (!demoMode && db) {
        db.ref(`quiz/teams/${teamId}`).remove();
      }
      render();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeImageModal();
        return;
      }
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === "f" || e.key === "F") {
        toggleFullscreen();
      } else if (e.key === "ArrowRight" || e.key === " ") {
        e.preventDefault();
        triggerPrimaryAction();
      }
    });

    function triggerPrimaryAction() {
      if (state.status === "lobby") {
        if (Object.keys(state.teams).length > 0) advanceToQuestion(0);
      } else if (state.status === "section_intro") {
        startQuestion(state.currentIndex);
      } else if (state.status === "question") {
        revealAnswer();
      } else if (state.status === "reveal") {
        if (state.currentIndex + 1 >= QUESTIONS.length) showFinished();
        else showLeaderboard();
      } else if (state.status === "leaderboard") {
        advanceToQuestion(state.currentIndex + 1);
      }
    }

    function updateTimerUI(ratioOverride) {
      const el = document.getElementById("timerNumber");
      const bar = document.getElementById("timerBar");
      const box = document.getElementById("timerBox");
      if (!el && !bar) return;

      const isLocked = !state.acceptingAnswers || state.status !== "question" || timeLeft <= 0;
      const ratio = typeof ratioOverride === "number" ? ratioOverride : getRemainingRatio();

      if (bar) {
        bar.style.transform = `scaleX(${isLocked ? 0 : ratio})`;
      }

      if (!el) return;
      if (isLocked) {
        el.textContent = "0";
        el.classList.remove("pulse-ring", "text-[#1C1917]");
        el.classList.add("text-rose-600");
        if (box) {
          box.classList.remove("border-[#DB562B]");
          box.classList.add("border-rose-500");
        }
        return;
      }

      if (el.textContent !== String(timeLeft)) {
        el.textContent = String(timeLeft);
      }
      if (timeLeft <= 5) {
        el.classList.remove("text-[#1C1917]");
        el.classList.add("text-rose-600", "pulse-ring");
        if (box) {
          box.classList.remove("border-[#DB562B]");
          box.classList.add("border-rose-500");
        }
      } else {
        el.classList.remove("text-rose-600", "pulse-ring");
        el.classList.add("text-[#1C1917]");
        if (box) {
          box.classList.remove("border-rose-500");
          box.classList.add("border-[#DB562B]");
        }
      }
    }

    function getSortedTeams() {
      return Object.entries(state.teams || {})
        .map(([id, data]) => ({ id, ...data, score: data.score || 0 }))
        .sort((a, b) => b.score - a.score || (a.joinedAt || 0) - (b.joinedAt || 0));
    }

    function render() {
      const stage = document.getElementById("stage");
      const progressBadge = document.getElementById("progressBadge");
      const statusSummary = document.getElementById("statusSummary");
      const actionButtons = document.getElementById("actionButtons");

      const screenKey = `${state.status}_${state.currentIndex}`;
      const animClass = screenKey !== lastScreenKey ? "fade-in" : "";
      lastScreenKey = screenKey;

      if (state.status === "section_intro") {
        const meta = state.sectionIntro || getSectionMeta(state.currentIndex);
        progressBadge.classList.remove("hidden");
        progressBadge.textContent = meta ? `${meta.sectionNumber}. szakasz` : "Új szakasz";
      } else if (state.currentIndex >= 0 && ["question", "reveal", "leaderboard"].includes(state.status)) {
        progressBadge.classList.remove("hidden");
        progressBadge.textContent = `${state.currentIndex + 1} / ${QUESTIONS.length} kérdés`;
      } else {
        progressBadge.classList.add("hidden");
      }

      if (state.status !== "question") {
        renderedQuestionKey = "";
      }

      if (state.status === "setup") {
        renderSetup(stage, statusSummary, actionButtons, animClass);
      } else if (state.status === "lobby") {
        renderLobby(stage, statusSummary, actionButtons, animClass);
      } else if (state.status === "section_intro") {
        renderSectionIntro(stage, statusSummary, actionButtons, animClass);
      } else if (state.status === "question") {
        renderQuestion(stage, statusSummary, actionButtons, animClass);
      } else if (state.status === "reveal") {
        renderReveal(stage, statusSummary, actionButtons, animClass);
      } else if (state.status === "leaderboard") {
        renderLeaderboard(stage, statusSummary, actionButtons, false, animClass);
      } else if (state.status === "finished") {
        renderLeaderboard(stage, statusSummary, actionButtons, true, animClass);
      }
    }

    function renderSetup(stage, statusSummary, actionButtons, animClass) {
      stage.innerHTML = `
        <div class="${animClass} max-w-2xl mx-auto card-surface rounded-3xl p-8 md:p-10 text-center">
          <div class="w-16 h-16 mx-auto rounded-2xl bg-[#DB562B]/12 border border-[#DB562B]/25 flex items-center justify-center text-3xl mb-5">
            ⚙️
          </div>
          <h2 class="font-brand text-3xl font-extrabold text-[#1C1917] mb-3">A Firebase még nincs bekötve</h2>

            Másold be a Firebase projektadataidat a
            <code class="px-2 py-0.5 rounded bg-[#F3ECE0] text-[#B9421C] font-mono text-sm">config.js</code> fájlba, vagy teszteld most Demo módban.
          </p>
          <button onclick="startDemoMode()" class="w-full sm:w-auto px-8 py-4 rounded-2xl bg-[#DB562B] hover:bg-[#B9421C] text-white font-bold text-lg transition shadow-lg shadow-[#DB562B]/25">
            Demo mód kipróbálása
          </button>
        </div>
      `;

      actionButtons.innerHTML = "";
    }

      const isLocal = !window.location.protocol.startsWith("http");

            <span class="inline-block px-3.5 py-1 rounded-full bg-[#DB562B]/12 text-[#B9421C] text-xs font-extrabold uppercase tracking-wider mb-4">
              Csatlakozás telefonról
            </span>
            <h2 class="font-brand text-3xl font-extrabold text-[#1C1917] mb-2">Olvasd be a QR-kódot!</h2>
            <p class="text-[#6B6258] text-sm mb-6">Minden 2 fős csapatból <strong class="text-[#1C1917]">egy fő</strong> lépjen be.</p>

            <div class="bg-white p-4 rounded-2xl inline-block border border-[#E8DEC9] shadow-sm mb-5">
              <div id="qrcode"></div>
            </div>

            <div class="bg-[#F8F5EC] border border-[#E8DEC9] rounded-xl px-4 py-3 text-xs sm:text-sm font-mono text-[#B9421C] break-all">
              ${escapeHtml(playerUrl)}
            </div>

          </div>

          <div class="lg:col-span-7">
            <div class="flex items-end justify-between gap-4 mb-6">

                <p class="text-[#6B6258] mt-1 font-medium">${QUESTIONS.length} kérdés vár rátok (ABCD, számtippelős és képfelismerés)</p>
              </div>
              <div class="px-5 py-2.5 rounded-2xl bg-[#DB562B] text-white font-extrabold text-xl shadow-md shadow-[#DB562B]/25 shrink-0">
                ${teams.length} csapat
              </div>

            ${teams.length === 0 ? `
              <div class="card-surface border-dashed border-2 border-[#D9CCB5] rounded-3xl p-12 text-center text-[#6B6258]">

            ` : `
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                ${teams.map((t, i) => `
                  <div class="group card-surface rounded-2xl px-5 py-4 flex items-center justify-between">
                    <div class="flex items-center gap-3.5 min-w-0">
                      <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#DB562B] to-[#FA8841] text-white flex items-center justify-center font-black text-sm shrink-0 shadow-sm">
                        ${i + 1}
                      </span>
                      <span class="font-bold text-lg text-[#1C1917] truncate">${escapeHtml(t.name)}</span>
                    </div>
                    <button onclick="removeTeam('${t.id}')" title="Csapat törlése" class="opacity-40 group-hover:opacity-100 text-[#B9421C] hover:text-rose-700 text-sm px-2 py-1 transition">
                      ✕

      const qrBox = document.getElementById("qrcode");
      if (qrBox && window.QRCode) {
        new QRCode(qrBox, {

        ? "Várakozás legalább 1 csapat csatlakozására..."
        : `${teams.length} csapat készen áll! Nyomj a Kvíz indítása gombra (vagy Space-re).`;

      actionButtons.innerHTML = `

    function renderSectionIntro(stage, statusSummary, actionButtons, animClass) {
      const meta = state.sectionIntro || getSectionMeta(state.currentIndex);
      if (!meta) {
        startQuestion(state.currentIndex);
        return;
      }

      stage.innerHTML = `
        <div class="${animClass} max-w-4xl mx-auto w-full">

              <span>${meta.sectionNumber}. szakasz</span>
              <span class="opacity-50">•</span>
              <span>${meta.count} kérdés</span>
            </div>

              ${escapeHtml(meta.title)}

            <div class="my-8 md:my-10 flex items-center justify-center">
              <div class="relative flex items-center justify-center">
                <div class="absolute inset-0 rounded-full bg-gradient-to-br ${meta.glowClass} blur-xl opacity-75 scale-110"></div>
                <div class="relative w-36 h-36 md:w-44 md:h-44 rounded-full bg-gradient-to-br ${meta.glowClass} border-2 flex items-center justify-center shadow-xl">
                  <span class="emoji-float text-7xl md:text-8xl leading-none select-none" role="img" aria-label="${escapeHtml(meta.title)}">
                    ${meta.emoji}
                  </span>
                </div>
              </div>
            </div>

              ${escapeHtml(meta.subtitle)}
            </p>
          </div>
        </div>
      `;

      statusSummary.textContent = `${meta.sectionNumber}. szakasz: ${meta.title} (${meta.count} kérdés) — nyomj a gombbal vagy Space-szel az indításhoz!`;
      actionButtons.innerHTML = `
        <button onclick="startQuestion(${state.currentIndex})"
          class="px-8 py-3.5 rounded-xl bg-[#DB562B] hover:bg-[#B9421C] text-white font-extrabold text-base transition shadow-lg shadow-[#DB562B]/25">
          Szakasz indítása →
        </button>
      `;
    }

    function buildTeamChipsHtml(teams, qAnswers) {
      return teams.map(t => {
        const done = Boolean(qAnswers[t.id]);
        return `
          <span class="px-4 py-1.5 rounded-full text-sm font-bold border transition ${
            done
              ? "bg-emerald-50 border-emerald-300 text-emerald-800 shadow-sm"
              : "bg-white/80 border-[#E8DEC9] text-[#6B6258]"
          }">
            ${done ? "✓ " : "⏳ "}${escapeHtml(t.name)}
          </span>
        `;
      }).join("");
    }

    function renderQuestion(stage, statusSummary, actionButtons, animClass) {
      const q = QUESTIONS[state.currentIndex];
      const teams = getSortedTeams();
      const qAnswers = (state.answers && state.answers[state.currentIndex]) ? state.answers[state.currentIndex] : {};
      const answeredIds = Object.keys(qAnswers).filter(id => state.teams[id]);
      const allAnswered = teams.length > 0 && answeredIds.length >= teams.length;
      const qRenderKey = `question_${state.currentIndex}_${state.acceptingAnswers}`;

      // Ha ugyanaz az aktív kérdés van kivetítve, csak a számlálót és a csapat-chipeket frissítjük,
      // így a folyamatos visszaszámláló csík és a kép egyáltalán nem villan meg!
      if (renderedQuestionKey === qRenderKey && document.getElementById("teamChipsContainer")) {
        const counterEl = document.getElementById("answeredCounter");
        if (counterEl) {
          counterEl.textContent = `${answeredIds.length} / ${teams.length}`;
          counterEl.className = `text-2xl font-black ${allAnswered ? "text-emerald-700" : "text-[#1C1917]"}`;
        }
        const chipsEl = document.getElementById("teamChipsContainer");
        if (chipsEl) {
          chipsEl.innerHTML = buildTeamChipsHtml(teams, qAnswers);
        }
        statusSummary.textContent = allAnswered
          ? "Minden csapat válaszolt! Felfedheted az eredményt."
          : state.acceptingAnswers
            ? `Válaszadás folyamatban (${answeredIds.length}/${teams.length})...`
            : "Idő lejárt! Kattints a válasz felfedésére.";
        return;
      }

      renderedQuestionKey = qRenderKey;
      const initialRatio = state.acceptingAnswers ? getRemainingRatio() : 0;

      let typeBadgeClass = "bg-[#DB562B]/12 border-[#DB562B]/25 text-[#B9421C]";
      let typeBadgeLabel = "🔘 ABCD választós";
      if (q.type === "number") {
        typeBadgeClass = "bg-[#FA8841]/20 border-[#FA8841]/40 text-[#9A3412]";
        typeBadgeLabel = "🎯 Számtippelős kör";
      } else if (q.type === "text") {
        typeBadgeClass = "bg-[#0F766E]/12 border-[#0F766E]/30 text-[#0F766E]";
        typeBadgeLabel = q.image ? "🖼️ Képfelismerés" : "✍️ Szöveges válasz";
      }

      const imageHtml = q.image ? `
        <div class="mt-4 flex flex-col items-center">
          <div class="relative inline-block rounded-2xl overflow-hidden border-2 border-[#E8DEC9] bg-[#1C1917] shadow-lg">
            <img
              src="${escapeHtml(q.image)}"
              alt="Felismerendő kép"
              onclick="openImageModal('${escapeHtml(q.image)}')"
              title="Kattints a teljes méretű nézethez"
              class="max-h-[46vh] w-auto max-w-full object-contain cursor-zoom-in block"
              onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');"
            />
            <div class="hidden px-8 py-12 text-center bg-[#FAF7F2] text-[#B9421C]">
              <div class="text-3xl mb-2">⚠️</div>
              <p class="font-bold">A kép nem található: <code class="font-mono">${escapeHtml(q.image)}</code></p>
              <p class="text-xs text-[#6B6258] mt-1">Ellenőrizd, hogy fel van-e töltve a GitHubra pontosan ezen a néven!</p>
            </div>
          </div>
        </div>
      ` : "";

      let bodyHtml = "";
      if (q.type === "abcd") {
        bodyHtml = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${q.options.map((opt, idx) => `
              <div class="card-surface rounded-2xl p-5 flex items-center gap-4 border ${OPTION_STYLES[idx].ring}">
                <div class="w-14 h-14 rounded-xl ${OPTION_STYLES[idx].bg} text-white font-black text-2xl flex items-center justify-center shrink-0 shadow-sm">
                  ${OPTION_LABELS[idx]}
                </div>
                <div class="text-xl md:text-2xl font-bold text-[#1C1917] leading-snug">
                  ${escapeHtml(opt)}
                </div>
              </div>
            `).join("")}
          </div>
        `;
      } else if (q.type === "number") {
        bodyHtml = `
          <div class="bg-white/90 border-2 border-[#FA8841]/45 rounded-3xl p-7 text-center shadow-sm">
            <p class="text-2xl font-extrabold text-[#1C1917]">
              Írjátok be a tippeteket a telefonon!${q.unit ? ` <span class="text-[#DB562B]">(${escapeHtml(q.unit)})</span>` : ""}
            </p>
            <p class="text-[#57534E] mt-2 text-sm md:text-base font-medium">
              Telitalálat: <strong class="text-emerald-700">+150 pt</strong> • Legközelebbi tipp: <strong class="text-[#DB562B]">+100 pt</strong> • 2. legközelebbi: <strong class="text-[#0F766E]">+50 pt</strong>
            </p>
          </div>
        `;
      } else if (q.type === "text") {
        bodyHtml = `
          <div class="bg-white/90 border border-[#0F766E]/30 rounded-2xl px-6 py-3.5 text-center shadow-sm">
            <p class="text-base md:text-lg font-bold text-[#1C1917]">
              ✍️ Írjátok be a választ a telefonon! <span class="text-[#6B6258] font-medium text-sm md:text-base">(Kis-/nagybetű és ékezet nem számít • Helyes válasz: <strong class="text-[#0F766E]">+${q.points || 100} pt</strong>)</span>
            </p>
          </div>
        `;
      }

      stage.innerHTML = `
        <div class="${animClass} space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-2.5">
              <span class="px-4 py-1.5 rounded-full bg-white border border-[#E8DEC9] text-[#1C1917] font-bold text-sm uppercase tracking-wider shadow-sm">
                ${escapeHtml(q.category || "Kérdés")}
              </span>
              <span class="px-4 py-1.5 rounded-full ${typeBadgeClass} border font-bold text-sm">
                ${typeBadgeLabel}
              </span>
            </div>

            <div class="flex items-center gap-4">
              <div class="text-right">
                <div class="text-xs uppercase tracking-wider text-[#6B6258] font-bold">Válaszoltak</div>
                <div id="answeredCounter" class="text-2xl font-black ${allAnswered ? "text-emerald-700" : "text-[#1C1917]"}">
                  ${answeredIds.length} / ${teams.length}
                </div>
              </div>
              <div id="timerBox" class="w-16 h-16 md:w-20 md:h-20 rounded-2xl bg-white border-2 ${!state.acceptingAnswers ? "border-rose-500" : timeLeft <= 5 ? "border-rose-500" : "border-[#DB562B]"} flex flex-col items-center justify-center shadow-md">
                <span id="timerNumber" class="text-2xl md:text-3xl font-black leading-none ${!state.acceptingAnswers ? "text-rose-600" : timeLeft <= 5 ? "text-rose-600 pulse-ring" : "text-[#1C1917]"}">
                  ${state.acceptingAnswers ? Math.max(0, timeLeft) : "0"}
                </span>
                <span class="text-[10px] uppercase text-[#6B6258] font-bold mt-0.5">mp</span>
              </div>
            </div>
          </div>

          <div class="w-full h-2.5 bg-[#E8DEC9] rounded-full overflow-hidden">
            <div id="timerBar" class="w-full h-full bg-gradient-to-r from-[#FA8841] to-[#DB562B] origin-left will-change-transform" style="transform: scaleX(${initialRatio})"></div>
          </div>

          <div class="card-surface rounded-3xl ${q.image ? "p-5 md:p-6" : "p-8 md:p-11"} text-center">
            <h2 class="${q.image ? "text-2xl md:text-3xl" : "text-3xl md:text-5xl"} font-black leading-tight tracking-tight text-[#1C1917]">
              ${escapeHtml(q.text)}
            </h2>
            ${imageHtml}
            ${!state.acceptingAnswers ? `
              <div class="inline-block mt-4 px-5 py-1.5 rounded-full bg-rose-100 border border-rose-300 text-rose-700 font-bold text-sm md:text-base">
                ⏰ Lejárt az idő! A válaszadás lezárult.
              </div>
            ` : ""}
          </div>

          ${bodyHtml}

          <div id="teamChipsContainer" class="flex flex-wrap items-center justify-center gap-2 pt-1">
            ${buildTeamChipsHtml(teams, qAnswers)}
          </div>
        </div>
      `;

      statusSummary.textContent = allAnswered
        ? "Minden csapat válaszolt! Felfedheted az eredményt."
        : state.acceptingAnswers
          ? `Válaszadás folyamatban (${answeredIds.length}/${teams.length})...`
          : "Idő lejárt! Kattints a válasz felfedésére.";

      actionButtons.innerHTML = `
        ${state.acceptingAnswers ? `
          <button onclick="lockAnswers()" class="px-4 py-2.5 rounded-xl bg-white hover:bg-[#F3ECE0] border border-[#E8DEC9] text-[#44403C] font-bold text-sm transition">
            Idő leállítása
          </button>
        ` : ""}
        <button onclick="revealAnswer()" class="px-7 py-3 rounded-xl bg-[#DB562B] hover:bg-[#B9421C] text-white font-extrabold text-base transition shadow-lg shadow-[#DB562B]/25">
          Válasz felfedése →
        </button>
      `;
    }

    function renderReveal(stage, statusSummary, actionButtons, animClass) {
      const q = QUESTIONS[state.currentIndex];
      const rev = state.revealedAnswer;
      const qAnswers = (state.answers && state.answers[state.currentIndex]) ? state.answers[state.currentIndex] : {};

      let detailHtml = "";

      if (q.type === "abcd") {
        const counts = [0, 0, 0, 0];
        Object.entries(qAnswers).forEach(([tid, ans]) => {
          if (state.teams[tid] && ans.value >= 0 && ans.value <= 3) counts[ans.value]++;
        });

        detailHtml = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${q.options.map((opt, idx) => {
              const isCorrect = idx === q.correct;
              return `
                <div class="rounded-2xl p-5 flex items-center justify-between gap-4 border-2 transition ${
                  isCorrect
                    ? "bg-emerald-50 border-emerald-500 shadow-md scale-[1.01]"
                    : "bg-white/65 border-[#E8DEC9] opacity-60"
                }">
                  <div class="flex items-center gap-4 min-w-0">
                    <div class="w-12 h-12 rounded-xl ${isCorrect ? "bg-emerald-600 text-white" : "bg-[#EAE0D0] text-[#57534E]"} font-black text-xl flex items-center justify-center shrink-0">
                      ${isCorrect ? "✓" : OPTION_LABELS[idx]}
                    </div>
                    <div class="text-xl font-bold ${isCorrect ? "text-emerald-950" : "text-[#57534E]"} leading-snug">
                      ${escapeHtml(opt)}
                    </div>
                  </div>
                  <span class="px-3.5 py-1 rounded-full text-sm font-extrabold shrink-0 ${isCorrect ? "bg-emerald-600/15 text-emerald-800" : "bg-[#EFE7DA] text-[#6B6258]"}">
                    ${counts[idx]} csapat
                  </span>
                </div>
              `;
            }).join("")}
          </div>
        `;
      } else if (q.type === "number") {
        const ranking = rev?.numberRanking || [];
        detailHtml = `
          <div class="card-surface rounded-3xl p-6">
            <h3 class="text-lg font-extrabold text-[#57534E] mb-4">Csapatok tippjei (pontossági sorrendben)</h3>
            ${ranking.length === 0 ? `
              <p class="text-[#6B6258] py-4 text-center">Nem érkezett érvényes tipp ebben a körben.</p>
            ` : `
              <div class="space-y-2.5">
                ${ranking.map((r, i) => `
                  <div class="flex items-center justify-between gap-4 px-5 py-3.5 rounded-2xl border ${
                    r.delta >= 150 ? "bg-emerald-50 border-emerald-400" :
                    r.delta >= 100 ? "bg-[#FFF4EC] border-[#FA8841]" :
                    r.delta >= 50  ? "bg-teal-50/70 border-teal-300" :
                    "bg-[#FAF7F2] border-[#E8DEC9]"
                  }">
                    <div class="flex items-center gap-3 min-w-0">
                      <span class="w-8 h-8 rounded-lg bg-white border border-[#E8DEC9] text-[#1C1917] font-black text-sm flex items-center justify-center shrink-0">${i + 1}.</span>
                      <span class="font-bold text-lg text-[#1C1917] truncate">${escapeHtml(r.teamName)}</span>
                    </div>
                    <div class="flex items-center gap-4 shrink-0">
                      <div class="text-right">
                        <div class="text-xl font-black text-[#1C1917]">${formatNumber(r.value)}${q.unit ? " " + escapeHtml(q.unit) : ""}</div>
                        <div class="text-xs text-[#6B6258] font-medium">${r.diff === 0 ? "Pontos!" : "Eltérés: ±" + formatNumber(r.diff)}</div>
                      </div>
                      <span class="min-w-[148px] text-center px-3 py-1.5 rounded-xl text-xs font-extrabold ${
                        r.delta >= 150 ? "bg-emerald-600 text-white" :
                        r.delta >= 100 ? "bg-[#DB562B] text-white" :
                        r.delta >= 50  ? "bg-[#0F766E] text-white" :
                        "bg-[#EAE0D0] text-[#6B6258]"
                      }">
                        ${r.badge || "0 pt"}
                      </span>
                    </div>
                  </div>
                `).join("")}
              </div>
            `}
          </div>
        `;
      } else if (q.type === "text") {
        const results = rev?.textResults || [];
        const pts = q.points || 100;
        detailHtml = `
          <div class="card-surface rounded-3xl p-6">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <h3 class="text-lg font-extrabold text-[#57534E]">Csapatok válaszai</h3>
              <span class="text-xs text-[#6B6258] font-medium">Apró elírásnál az „Elfogad” gombbal kézzel is megadhatod a pontot</span>
            </div>
            ${results.length === 0 ? `
              <p class="text-[#6B6258] py-4 text-center">Nem érkezett válasz ebben a körben.</p>
            ` : `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                ${results.map((r) => `
                  <div class="flex items-center justify-between gap-3 px-4 py-3.5 rounded-2xl border ${
                    r.isCorrect
                      ? "bg-emerald-50 border-emerald-400"
                      : "bg-[#FAF7F2] border-[#E8DEC9]"
                  }">
                    <div class="min-w-0">
                      <div class="text-xs font-bold uppercase tracking-wider text-[#6B6258] truncate">${escapeHtml(r.teamName)}</div>
                      <div class="text-lg font-extrabold ${r.rawAnswer ? "text-[#1C1917]" : "text-[#A89F91] italic"} truncate mt-0.5">
                        ${r.rawAnswer ? escapeHtml(r.rawAnswer) : "Nem érkezett válasz"}
                      </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                      <span class="px-3 py-1.5 rounded-xl text-xs font-extrabold ${
                        r.isCorrect ? "bg-emerald-600 text-white" : "bg-[#EAE0D0] text-[#6B6258]"
                      }">
                        ${r.isCorrect ? `✓ +${r.delta} pt` : "✕ 0 pt"}
                      </span>
                      ${r.rawAnswer ? `
                        <button
                          onclick="toggleTextOverride('${r.teamId}')"
                          title="${r.isCorrect ? "Pont visszavonása" : "Válasz kézi elfogadása"}"
                          class="px-2.5 py-1.5 rounded-xl text-xs font-bold border transition ${
                            r.isCorrect
                              ? "bg-white hover:bg-rose-50 border-[#E8DEC9] text-[#6B6258] hover:text-rose-700"
                              : "bg-white hover:bg-emerald-50 border-emerald-300 text-emerald-700"
                          }">
                          ${r.isCorrect ? "Visszavon" : `Elfogad (+${pts})`}
                        </button>
                      ` : ""}
                    </div>
                  </div>
                `).join("")}
              </div>
            `}
          </div>
        `;
      }

      stage.innerHTML = `
        <div class="${animClass} space-y-5">
          <div class="bg-white border-2 border-emerald-500/70 rounded-3xl p-6 md:p-7 shadow-lg ${q.image ? "flex flex-col md:flex-row items-center justify-center gap-6 text-center md:text-left" : "text-center"}">
            ${q.image ? `
              <img
                src="${escapeHtml(q.image)}"
                alt="${escapeHtml(rev?.display || "")}"
                onclick="openImageModal('${escapeHtml(q.image)}')"
                class="h-32 md:h-36 w-auto rounded-2xl border border-[#E8DEC9] shadow-sm object-cover cursor-zoom-in shrink-0"
              />
            ` : ""}
            <div>
              <span class="inline-block px-3.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-extrabold uppercase tracking-wider mb-2.5">
                Helyes válasz
              </span>
              <h2 class="font-brand text-3xl md:text-5xl font-black text-[#1C1917] tracking-tight">
                ${escapeHtml(rev?.display || "")}
              </h2>
              ${q.explanation ? `<p class="text-[#57534E] text-lg mt-2.5 max-w-3xl mx-auto font-medium">${escapeHtml(q.explanation)}</p>` : ""}
            </div>
          </div>

          ${detailHtml}
        </div>
      `;

      const isLast = state.currentIndex + 1 >= QUESTIONS.length;
      statusSummary.textContent = "A pontok automatikusan jóváírásra kerültek.";
      actionButtons.innerHTML = `
        <button onclick="${isLast ? "showFinished()" : "showLeaderboard()"}"
          class="px-7 py-3 rounded-xl bg-[#1C1917] hover:bg-[#332E2A] text-white font-extrabold text-base transition shadow-lg">
          ${isLast ? "Végeredmény megtekintése 🏆" : "Állás megtekintése →"}
        </button>
      `;
    }

    function renderLeaderboard(stage, statusSummary, actionButtons, isFinal, animClass) {
      const teams = getSortedTeams();
      const medals = ["🥇", "🥈", "🥉"];

      stage.innerHTML = `
        <div class="${animClass} max-w-4xl mx-auto w-full space-y-6">
          <div class="text-center">
            <span class="inline-block px-4 py-1.5 rounded-full ${isFinal ? "bg-[#DB562B] text-white" : "bg-[#DB562B]/12 text-[#B9421C]"} text-xs font-extrabold uppercase tracking-wider mb-3">
              ${isFinal ? "🏆 Végeredmény" : "Aktuális állás"}
            </span>
            <h2 class="font-brand text-4xl md:text-5xl font-black tracking-tight text-[#1C1917]">
              ${isFinal ? (teams[0] ? `Győztes: ${escapeHtml(teams[0].name)}!` : "Vége a kvíznek!") : "Ranglista"}
            </h2>
          </div>

          <div class="space-y-3">
            ${teams.map((t, idx) => `
              <div class="flex items-center justify-between gap-4 px-6 py-4 rounded-2xl border shadow-sm ${
                idx === 0 ? "bg-gradient-to-r from-[#FFF1E6] via-white to-white border-[#DB562B] ring-1 ring-[#DB562B]/25" :
                idx === 1 ? "bg-white/95 border-[#D6C8B4]" :
                idx === 2 ? "bg-white/95 border-[#FA8841]/60" :
                "bg-white/85 border-[#E8DEC9]"
              }">
                <div class="flex items-center gap-4 min-w-0">
                  <div class="w-11 h-11 rounded-xl ${idx === 0 ? "bg-[#DB562B]/15" : "bg-[#F3ECE0]"} flex items-center justify-center font-black text-xl text-[#1C1917] shrink-0">
                    ${medals[idx] || (idx + 1) + "."}
                  </div>
                  <div class="text-xl md:text-2xl font-extrabold text-[#1C1917] truncate">${escapeHtml(t.name)}</div>
                </div>

                <div class="flex items-center gap-3 shrink-0">
                  <button onclick="adjustScore('${t.id}', -50)" title="-50 pont" class="w-8 h-8 rounded-lg bg-[#F3ECE0] hover:bg-rose-100 text-[#6B6258] hover:text-rose-700 font-bold text-sm transition">-</button>
                  <div class="min-w-[110px] text-right text-2xl md:text-3xl font-black text-[#DB562B]">
                    ${t.score} <span class="text-sm text-[#6B6258] font-bold">pt</span>
                  </div>
                  <button onclick="adjustScore('${t.id}', 50)" title="+50 pont" class="w-8 h-8 rounded-lg bg-[#F3ECE0] hover:bg-emerald-100 text-[#6B6258] hover:text-emerald-700 font-bold text-sm transition">+</button>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;

      if (isFinal) {
        statusSummary.textContent = "Köszönjük a játékot! A +/- gombokkal kézzel is módosíthatsz pontot.";
        actionButtons.innerHTML = `
          <button onclick="confirmReset()" class="px-7 py-3 rounded-xl bg-[#DB562B] hover:bg-[#B9421C] text-white font-extrabold text-base transition shadow-lg shadow-[#DB562B]/25">
            Új játék indítása
          </button>
        `;
      } else {
        const nextIdx = state.currentIndex + 1;
        const nextIsNewSection = isSectionStart(nextIdx);
        const nextMeta = nextIsNewSection ? getSectionMeta(nextIdx) : null;
        statusSummary.textContent = nextIsNewSection && nextMeta
          ? `Következik a(z) ${nextMeta.sectionNumber}. szakasz: ${nextMeta.title}`
          : `Következik: ${nextIdx + 1}. kérdés / ${QUESTIONS.length}`;
        actionButtons.innerHTML = `
          <button onclick="advanceToQuestion(${nextIdx})" class="px-7 py-3 rounded-xl bg-[#DB562B] hover:bg-[#B9421C] text-white font-extrabold text-base transition shadow-lg shadow-[#DB562B]/25">
            ${nextIsNewSection ? "Következő szakasz →" : "Következő kérdés →"}
          </button>
        `;
      }
    }

    init();
  </script>
</body>
</html>
