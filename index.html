<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GM Club – Kvízest</title>
  <link rel="icon" type="image/png" href="./logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="./config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #F8F5EC;
      --terracotta: #DB562B;
      --tangerine: #FA8841;
      --ink: #1C1917;
      --line: #E8DEC9;
    }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background-color: var(--cream);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }
    .font-brand {
      font-family: 'Fraunces', Georgia, serif;
    }
    .card-surface {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      box-shadow: 0 16px 34px -20px rgba(120, 53, 15, 0.18), 0 2px 8px -2px rgba(28, 25, 23, 0.05);
      backdrop-filter: blur(8px);
    }
    .fade-in { animation: fadeIn 0.25s ease-out both; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-[100dvh] flex flex-col relative overflow-x-hidden">

  <!-- Minimalista háttér motívumok mobilra méretezve -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none select-none" aria-hidden="true">
    <svg class="absolute -top-10 -right-12 w-44 opacity-85" viewBox="0 0 240 260" fill="none">
      <path d="M88 12C142 -4 206 24 226 84C246 144 218 220 162 242C106 264 38 228 24 166C10 104 34 28 88 12Z" fill="#FA8841"/>
    </svg>
    <svg class="absolute top-24 -left-10 w-28 opacity-85" viewBox="0 0 180 200" fill="none">
      <path d="M74 16C116 20 144 64 156 106C168 148 140 188 94 190C48 192 14 156 12 108C10 60 32 12 74 16Z" fill="#DB562B"/>
    </svg>
    <svg class="absolute -bottom-16 -left-14 w-52 opacity-85" viewBox="0 0 280 280" fill="none">
      <path d="M56 26C118 4 198 34 234 96C270 158 252 246 188 266C124 286 38 258 14 196C-10 134 -6 48 56 26Z" fill="#FA8841"/>
    </svg>
    <svg class="absolute bottom-8 -right-8 w-28 opacity-85" viewBox="0 0 180 180" fill="none">
      <path d="M98 14C140 16 172 56 164 100C156 144 126 174 82 170C38 166 10 130 16 86C22 42 56 12 98 14Z" fill="#DB562B"/>
    </svg>
  </div>

  <!-- Letisztult mobil fejléc -->
  <header class="px-4 py-3.5 border-b border-[#E8DEC9] bg-[#F8F5EC]/90 backdrop-blur-md flex items-center justify-between sticky top-0 z-20">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-9 h-9 rounded-full overflow-hidden shrink-0 ring-2 ring-white shadow-sm bg-[#DB562B] flex items-center justify-center">
        <img src="./logo.png" alt="GM Club" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
        <span class="hidden w-full h-full items-center justify-center font-black text-xs text-white">GM</span>
      </div>
      <div class="truncate">
        <div id="teamHeaderName" class="font-brand font-extrabold text-base leading-tight text-[#DB562B] truncate">GM CLUB</div>
        <div id="teamHeaderScore" class="text-xs text-[#6B6258] font-bold hidden">0 pont</div>
      </div>
    </div>
    <button id="leaveBtn" onclick="leaveTeam()" class="hidden text-xs font-bold text-[#6B6258] hover:text-[#B9421C] px-3 py-1.5 rounded-xl bg-white border border-[#E8DEC9] shadow-sm">
      Kilépés
    </button>
  </header>

  <!-- Fő tartalom -->
  <main id="app" class="flex-1 w-full max-w-md mx-auto px-4 py-6 flex flex-col justify-center relative z-10">
    <div class="text-center text-[#6B6258] font-medium">Betöltés...</div>
  </main>

  <script>
    const STORAGE_KEY = "kvizest_team_id_v1";
    const OPTION_LABELS = ["A", "B", "C", "D"];
    const OPTION_BTN_COLORS = [
      "bg-[#DB562B]",
      "bg-[#0F766E]",
      "bg-[#FA8841]",
      "bg-[#3730A3]"
    ];

    let db = null;
    let teamId = localStorage.getItem(STORAGE_KEY) || null;
    let quizData = null;
    let lastViewSignature = "";

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatNumber(n) {
      if (typeof n !== "number" || Number.isNaN(n)) return String(n);
      return n.toLocaleString("hu-HU", { maximumFractionDigits: 4 });
    }

    function init() {
      if (!window.isFirebaseConfigured()) {
        document.getElementById("app").innerHTML = `
          <div class="card-surface rounded-3xl p-6 text-center space-y-3">
            <div class="text-3xl">⚙️</div>
            <h1 class="font-brand text-xl font-extrabold text-[#1C1917]">A kvíz még nincs bekötve</h1>
            <p class="text-sm text-[#6B6258]">
              A szervezőnek előbb ki kell töltenie a <code class="text-[#B9421C]">config.js</code> fájlt.
            </p>
          </div>
        `;
        return;
      }

      if (!firebase.apps.length) {
        firebase.initializeApp(window.FIREBASE_CONFIG);
      }
      db = firebase.database();

      db.ref("quiz").on("value", (snap) => {
        quizData = snap.val() || { status: "lobby" };

        if (teamId && (!quizData.teams || !quizData.teams[teamId])) {
          teamId = null;
          localStorage.removeItem(STORAGE_KEY);
        }

        render();
      });
    }

    function joinTeam(e) {
      e.preventDefault();
      const input = document.getElementById("teamNameInput");
      const name = (input.value || "").trim();
      if (!name) return;

      const newId = "team_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 6);
      teamId = newId;
      localStorage.setItem(STORAGE_KEY, newId);

      db.ref(`quiz/teams/${newId}`).set({
        name: name.slice(0, 28),
        score: 0,
        joinedAt: Date.now()
      });
    }

    function leaveTeam() {
      if (!confirm("Biztosan kilépsz a csapatból?")) return;
      if (teamId && db) {
        db.ref(`quiz/teams/${teamId}`).remove();
      }
      teamId = null;
      localStorage.removeItem(STORAGE_KEY);
      lastViewSignature = "";
      render();
    }

    function submitAbcd(optionIndex) {
      if (!quizData || quizData.status !== "question" || !quizData.acceptingAnswers) return;
      const qIdx = quizData.currentIndex;
      if (quizData.answers && quizData.answers[qIdx] && quizData.answers[qIdx][teamId]) return;

      db.ref(`quiz/answers/${qIdx}/${teamId}`).set({
        value: optionIndex,
        submittedAt: Date.now()
      });
    }

    function submitNumber(e) {
      e.preventDefault();
      if (!quizData || quizData.status !== "question" || !quizData.acceptingAnswers) return;
      const qIdx = quizData.currentIndex;
      if (quizData.answers && quizData.answers[qIdx] && quizData.answers[qIdx][teamId]) return;

      const input = document.getElementById("numberGuessInput");
      const errEl = document.getElementById("numberError");
      const raw = (input.value || "").replace(/\s+/g, "").replace(",", ".");
      const num = Number(raw);

      if (raw === "" || Number.isNaN(num) || !Number.isFinite(num)) {
        errEl.textContent = "Kérlek, érvényes számot adj meg!";
        errEl.classList.remove("hidden");
        return;
      }

      db.ref(`quiz/answers/${qIdx}/${teamId}`).set({
        value: num,
        submittedAt: Date.now()
      });
    }

    function render() {
      const app = document.getElementById("app");
      const headerName = document.getElementById("teamHeaderName");
      const headerScore = document.getElementById("teamHeaderScore");
      const leaveBtn = document.getElementById("leaveBtn");

      const myTeam = teamId && quizData?.teams ? quizData.teams[teamId] : null;

      if (myTeam) {
        headerName.textContent = myTeam.name;
        headerName.classList.remove("font-brand", "text-[#DB562B]");
        headerName.classList.add("text-[#1C1917]");
        headerScore.textContent = `${myTeam.score || 0} pont`;
        headerScore.classList.remove("hidden");
        leaveBtn.classList.remove("hidden");
      } else {
        headerName.textContent = "GM CLUB";
        headerName.classList.add("font-brand", "text-[#DB562B]");
        headerName.classList.remove("text-[#1C1917]");
        headerScore.classList.add("hidden");
        leaveBtn.classList.add("hidden");
      }

      const status = quizData?.status || "lobby";
      const qIdx = quizData?.currentIndex;
      const q = quizData?.question;
      const myAnswer = (myTeam && quizData.answers && quizData.answers[qIdx]) ? quizData.answers[qIdx][teamId] : null;

      let rank = 0;
      if (myTeam && (status === "leaderboard" || status === "finished")) {
        const sorted = Object.entries(quizData.teams || {})
          .map(([id, d]) => ({ id, score: d.score || 0 }))
          .sort((a, b) => b.score - a.score);
        rank = sorted.findIndex(t => t.id === teamId) + 1;
      }

      const signature = JSON.stringify({
        loggedIn: Boolean(myTeam),
        teamName: myTeam?.name || "",
        status,
        qIdx,
        accepting: Boolean(quizData?.acceptingAnswers),
        answered: myAnswer ? myAnswer.value : null,
        rank,
        score: (status === "reveal" || status === "leaderboard" || status === "finished") ? (myTeam?.score || 0) : null
      });

      if (signature === lastViewSignature) return;
      lastViewSignature = signature;

      // 1. Nincs még belépve
      if (!myTeam) {
        app.innerHTML = `
          <form onsubmit="joinTeam(event)" class="fade-in card-surface rounded-3xl p-6 space-y-5">
            <div class="text-center">
              <div class="w-16 h-16 mx-auto mb-3 rounded-full overflow-hidden shadow-md ring-4 ring-[#F8F5EC] bg-[#DB562B] flex items-center justify-center">
                <img src="./logo.png" alt="GM Club" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                <span class="hidden w-full h-full items-center justify-center font-black text-white">GM</span>
              </div>
              <h1 class="font-brand text-2xl font-black text-[#1C1917]">Csatlakozás a kvízhez</h1>
              <p class="text-sm text-[#6B6258] mt-1">Csapatonként elég egy telefonról belépni.</p>
            </div>
            <div>
              <label for="teamNameInput" class="block text-xs font-bold uppercase tracking-wider text-[#6B6258] mb-2">
                Csapat neve
              </label>
              <input
                id="teamNameInput"
                type="text"
                maxlength="28"
                required
                autocomplete="off"
                placeholder="Pl. Kék Villámok"
                class="w-full px-4 py-4 rounded-2xl bg-[#FAF7F2] border border-[#DFD3BE] text-[#1C1917] text-lg font-bold placeholder:text-[#A89F91] focus:outline-none focus:border-[#DB562B] focus:bg-white transition"
              />
            </div>
            <button type="submit" class="w-full py-4 rounded-2xl bg-[#DB562B] hover:bg-[#B9421C] text-white font-extrabold text-lg active:scale-[0.98] transition shadow-lg shadow-[#DB562B]/25">
              Belépés a játékba
            </button>
          </form>
        `;
        return;
      }

      // 2. Lobby
      if (status === "lobby") {
        app.innerHTML = `
          <div class="fade-in card-surface rounded-3xl p-8 text-center space-y-4">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-100 border border-emerald-200 flex items-center justify-center text-3xl">
              ✅
            </div>
            <h2 class="font-brand text-2xl font-black text-[#1C1917]">Bent vagytok!</h2>
            <p class="text-[#57534E]">
              Csapat: <strong class="text-[#DB562B]">${escapeHtml(myTeam.name)}</strong>
            </p>
            <p class="text-sm text-[#6B6258]">
              Nézzétek a kivetítőt! Amint elindul az első kérdés, itt megjelennek a válaszgombok.
            </p>
          </div>
        `;
        return;
      }

      // 3. Aktív kérdés
      if (status === "question" && q) {
        if (myAnswer) {
          const sentText = q.type === "abcd"
            ? `${OPTION_LABELS[myAnswer.value]}) ${q.options[myAnswer.value]}`
            : `${formatNumber(Number(myAnswer.value))}${q.unit ? " " + q.unit : ""}`;

          app.innerHTML = `
            <div class="fade-in card-surface border-emerald-300 rounded-3xl p-8 text-center space-y-4">
              <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-100 flex items-center justify-center text-3xl">
                🔒
              </div>
              <h2 class="font-brand text-2xl font-black text-emerald-800">Válasz rögzítve!</h2>
              <div class="bg-[#FAF7F2] border border-[#E8DEC9] rounded-2xl px-4 py-3 text-lg font-extrabold text-[#1C1917]">
                ${escapeHtml(sentText)}
              </div>
              <p class="text-sm text-[#6B6258]">Várjátok meg a többieket és az eredményhirdetést a kivetítőn.</p>
            </div>
          `;
          return;
        }

        if (!quizData.acceptingAnswers) {
          app.innerHTML = `
            <div class="fade-in card-surface border-rose-300 rounded-3xl p-8 text-center space-y-3">
              <div class="text-4xl">⏰</div>
              <h2 class="font-brand text-2xl font-black text-rose-700">Lejárt az idő!</h2>
              <p class="text-sm text-[#6B6258]">Erre a kérdésre már nem érkezett be válasz tőletek. Figyeljétek a kivetítőt!</p>
            </div>
          `;
          return;
        }

        if (q.type === "abcd") {
          app.innerHTML = `
            <div class="fade-in space-y-4">
              <div class="card-surface rounded-2xl p-4">
                <div class="text-xs font-extrabold uppercase tracking-wider text-[#DB562B] mb-1">
                  ${q.index + 1} / ${q.total} • ${escapeHtml(q.category || "Kérdés")}
                </div>
                <p class="text-base font-bold leading-snug text-[#1C1917]">${escapeHtml(q.text)}</p>
              </div>

              <div class="space-y-3">
                ${q.options.map((opt, idx) => `
                  <button onclick="submitAbcd(${idx})"
                    class="w-full p-4 rounded-2xl bg-white hover:bg-[#FFF9F4] active:scale-[0.98] border border-[#E8DEC9] flex items-center gap-3.5 text-left transition shadow-sm">
                    <span class="w-11 h-11 rounded-xl ${OPTION_BTN_COLORS[idx]} text-white font-black text-xl flex items-center justify-center shrink-0">
                      ${OPTION_LABELS[idx]}
                    </span>
                    <span class="font-bold text-base leading-snug text-[#1C1917]">${escapeHtml(opt)}</span>
                  </button>
                `).join("")}
              </div>
            </div>
          `;
          return;
        }

        if (q.type === "number") {
          app.innerHTML = `
            <form onsubmit="submitNumber(event)" class="fade-in space-y-4">
              <div class="card-surface rounded-2xl p-5">
                <div class="text-xs font-extrabold uppercase tracking-wider text-[#DB562B] mb-1">
                  ${q.index + 1} / ${q.total} • 🎯 Számtippelős
                </div>
                <p class="text-lg font-extrabold leading-snug text-[#1C1917]">${escapeHtml(q.text)}</p>
              </div>

              <div class="card-surface rounded-3xl p-5 space-y-4">
                <label for="numberGuessInput" class="block text-xs font-bold uppercase tracking-wider text-[#6B6258]">
                  A ti tippetek${q.unit ? ` (${escapeHtml(q.unit)})` : ""}
                </label>
                <div class="flex items-center gap-2">
                  <input
                    id="numberGuessInput"
                    type="text"
                    inputmode="decimal"
                    autocomplete="off"
                    required
                    placeholder="Írj be egy számot..."
                    class="w-full px-4 py-4 rounded-2xl bg-[#FAF7F2] border border-[#DFD3BE] text-[#1C1917] text-2xl font-black text-center placeholder:text-[#A89F91] focus:outline-none focus:border-[#DB562B] focus:bg-white transition"
                  />
                  ${q.unit ? `<span class="text-[#57534E] font-bold text-base shrink-0">${escapeHtml(q.unit)}</span>` : ""}
                </div>
                <p id="numberError" class="hidden text-xs text-rose-600 font-semibold text-center"></p>
                <button type="submit" class="w-full py-4 rounded-2xl bg-[#DB562B] hover:bg-[#B9421C] text-white font-extrabold text-lg active:scale-[0.98] transition shadow-lg shadow-[#DB562B]/25">
                  Tipp beküldése
                </button>
              </div>
            </form>
          `;
          return;
        }
      }

      // 4. Válasz felfedése
      if (status === "reveal") {
        const rev = quizData.revealedAnswer;
        const myAward = rev?.awards ? rev.awards[teamId] : null;
        const gotPoints = myAward && myAward.delta > 0;

        app.innerHTML = `
          <div class="fade-in card-surface ${gotPoints ? "border-emerald-400" : ""} rounded-3xl p-7 text-center space-y-4">
            <div class="text-4xl">${gotPoints ? "🎉" : "😬"}</div>
            <h2 class="font-brand text-2xl font-black ${gotPoints ? "text-emerald-700" : "text-[#1C1917]"}">
              ${gotPoints ? `+${myAward.delta} pont!` : "Most nem járt pont"}
            </h2>
            ${myAward?.label && gotPoints ? `<div class="inline-block px-3.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold">${escapeHtml(myAward.label)}</div>` : ""}
            <div class="bg-[#FAF7F2] border border-[#E8DEC9] rounded-2xl p-4">
              <div class="text-xs uppercase tracking-wider text-[#6B6258] font-bold mb-1">Helyes válasz</div>
              <div class="text-lg font-extrabold text-[#1C1917]">${escapeHtml(rev?.display || "")}</div>
            </div>
            <p class="text-xs text-[#6B6258] font-semibold">Összpontszámotok: <strong class="text-[#DB562B]">${myTeam.score || 0} pt</strong></p>
          </div>
        `;
        return;
      }

      // 5. Ranglista / Végeredmény
      if (status === "leaderboard" || status === "finished") {
        app.innerHTML = `
          <div class="fade-in card-surface rounded-3xl p-8 text-center space-y-4">
            <div class="text-5xl">${status === "finished" && rank === 1 ? "🏆" : "📊"}</div>
            <h2 class="font-brand text-2xl font-black text-[#1C1917]">
              ${status === "finished" ? "Vége a kvíznek!" : "Aktuális helyezésetek"}
            </h2>
            <div class="font-brand text-5xl font-black text-[#DB562B]">${rank}. hely</div>
            <p class="text-lg font-bold text-[#1C1917]">${myTeam.score || 0} pont</p>
            <p class="text-sm text-[#6B6258]">
              ${status === "finished" ? "Köszönjük a játékot!" : "Készüljetek a következő kérdésre!"}
            </p>
          </div>
        `;
      }
    }

    init();
  </script>
</body>
</html>
